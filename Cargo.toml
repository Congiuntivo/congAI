[workspace]
resolver = "3"
members = [
    "crates/conga-core",
    "crates/conga-protocol",
    "crates/conga-rules",
    "crates/conga-server",
    "crates/conga-ai",
    "crates/conga-tui",
    "crates/conga-cli",
]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
rand_core = "0.10"
rand_chacha = "0.10"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "sync", "io-util"] }
ratatui = "0.30"
crossterm = "0.29"
